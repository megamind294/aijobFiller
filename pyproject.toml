[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rinkle-jobpilot"
version = "1.1.0"
description = "Local job application assistant with factual resumes, Gmail verification and Excel tracking"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["jobpilot"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.package-data]
jobpilot = ["templates/*.json", "web_templates/*.html", "web_static/*.css", "web_static/*.js", "fonts/*.ttf", "fonts/*.txt"]
