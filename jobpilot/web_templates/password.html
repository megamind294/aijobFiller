{% extends 'base.html' %}{% block title %}Account settings{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">YOUR ACCOUNT</div><h1>Keep your workspace private.</h1><p class="muted">Changing your password signs out other sessions.</p></div></div><section class="panel form-panel narrow"><h2>Change password</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="current">Current password</label><input id="current" name="current_password" type="password" autocomplete="current-password" required><label for="new">New password</label><input id="new" name="new_password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required><small class="field-hint">Use at least 14 characters.</small><label for="confirm">Confirm new password</label><input id="confirm" name="confirm_password" type="password" autocomplete="new-password" required><button class="button primary" type="submit">Update password →</button></form></section>{% endblock %}
