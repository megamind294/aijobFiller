<form method="post" action="{{ url_for('automation_save_lane') }}" class="automation-lane-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if lane %}<input type="hidden" name="lane_id" value="{{ lane.id }}">{% endif %}<div class="automation-rule-grid"><label>Name<input name="name" maxlength="100" value="{{ lane.name if lane else '' }}" placeholder="e.g. Frontend roles in Poland" required></label><label>Submission choice<select name="mode"><option value="review-first" {% if not lane or lane.mode=='review-first' %}selected{% endif %}>Review-first · recommended</option><option value="automatic" {% if lane and lane.mode=='automatic' %}selected{% endif %}>Automatic · supported adapters only</option></select></label></div><p class="automation-field-help">Review-first prepares the application for you to inspect. Automatic mode only proceeds with a configured, supported employer form; anything else pauses.</p><details class="automation-advanced"><summary>Optional matching and document rules</summary><div class="automation-rule-grid"><label>Role keywords, one per line<textarea name="keywords" rows="3" placeholder="Product designer&#10;UX researcher">{{ lane.keywords|join('\n') if lane else '' }}</textarea></label><label>Locations, one per line<textarea name="locations" rows="3" placeholder="Warsaw&#10;Remote">{{ lane.locations|join('\n') if lane else '' }}</textarea></label><label>Exclude these terms, one per line<textarea name="exclusions" rows="3">{{ lane.exclusions|join('\n') if lane else '' }}</textarea></label><label>Minimum skill coverage (%)<input name="threshold" type="number" min="0" max="100" value="{{ lane.threshold if lane else 0 }}"></label><label>Preparation<select name="optimization"><option value="honest" {% if not lane or lane.optimization=='honest' %}selected{% endif %}>Honest, deterministic source ordering</option><option value="off" {% if lane and lane.optimization=='off' %}selected{% endif %}>Off</option><option disabled>Aggressive — unavailable without configured AI</option></select></label><label>Résumé profile<select name="resume_profile"><option value="default">Current default verified profile</option>{% for profile in profiles %}<option value="{{ profile.id }}" {% if lane and lane.resume_profile==profile.id %}selected{% endif %}>{{ profile.name }}</option>{% endfor %}</select></label></div><label class="automation-checkbox"><input name="cover_letter" type="checkbox" value="yes" {% if not lane or lane.cover_letter %}checked{% endif %}> Prepare a cover letter</label></details><button class="button primary">{{ 'Save changes · lane turns off' if lane else 'Save lane · starts off' }}</button></form>
