name: JobPilot Linux checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-pol poppler-utils
      - name: Install application and browser dependencies
        run: |
          python -m pip install -r requirements-web.txt
          python -m pip install --no-deps .
          python -m playwright install --with-deps chromium
          python -m pip check
      - name: Run regression suite
        run: python -m unittest discover -s tests -q
      - name: Verify installed web assets
        working-directory: /tmp
        run: |
          python - <<'PY'
          from importlib.resources import files
          package = files('jobpilot')
          for name in ('web_templates/profile.html', 'web_static/profile_forms.js', 'fonts/DejaVuSans.ttf'):
              assert (package / name).is_file(), name
          print('Installed web assets verified.')
          PY
